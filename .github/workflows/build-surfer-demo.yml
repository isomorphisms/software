name: Build supplied SURFER GIF

on:
  push:
    branches:
      - fix-surfer-demo-from-drive

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[generated surfer gif]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-surfer-demo-from-drive

      - name: Render inline GIF from supplied MP4
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          input=media/algebraic-variety-explorer-demo.mp4
          output=media/algebraic-variety-explorer-demo-preview.gif
          palette="${RUNNER_TEMP}/surfer-palette.png"

          ffmpeg -loglevel error -y -i "$input" \
            -vf "fps=8,scale=480:-1:flags=lanczos,palettegen=max_colors=96:stats_mode=diff" \
            "$palette"

          ffmpeg -loglevel error -y -i "$input" -i "$palette" \
            -lavfi "fps=8,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=sierra2_4a:diff_mode=rectangle" \
            "$output"

          test "$(head -c 6 "$output")" = "GIF89a"
          test "$(stat -c %s "$output")" -gt 100000

      - name: Commit rendered GIF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/algebraic-variety-explorer-demo-preview.gif
          git diff --cached --quiet && exit 0
          git commit -m "Render supplied SURFER recording as inline GIF [generated surfer gif]"
          git push origin HEAD:fix-surfer-demo-from-drive
